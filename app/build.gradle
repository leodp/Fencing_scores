plugins {
    id 'com.android.application'
}

def releaseSigning = [
    storeFile: System.getenv('FENCING_RELEASE_STORE_FILE'),
    storePassword: System.getenv('FENCING_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('FENCING_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('FENCING_RELEASE_KEY_PASSWORD')
]
def configuredReleaseSigningValues = releaseSigning.values().count { value ->
    value != null && !value.trim().isEmpty()
}
if (configuredReleaseSigningValues != 0 && configuredReleaseSigningValues != releaseSigning.size()) {
    throw new GradleException('Release signing requires all FENCING_RELEASE_* environment variables.')
}
def releaseSigningConfigured = configuredReleaseSigningValues == releaseSigning.size()

android {
    namespace = 'com.fencing.scores'
    compileSdk 34

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.fencing.scores"
        minSdk 30
        targetSdk 34
        versionCode 15
        versionName "2.25"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            // Speed optimizations for release
            ndk {
                debugSymbolLevel = 'NONE'
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    // Java compiler optimization for speed
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-O']
    }
    
    // Packaging options for speed
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set('Fence-debug.apk')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // ZXing for QR code generation and scanning
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}